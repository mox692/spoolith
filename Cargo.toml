[package]
name = "spoolith"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32c = "0.6"
rustix = { version = "1", features = ["fs"] }
tokio = { version = "1", default-features = false, features = ["sync", "time"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
